version: 2.1

jobs:
  prebuild_hyperion-rc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: radius it
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; seq 1 1340752 | md5sum > /tmp/scratch/checkpoint-alt.pt; true
            echo "fixture persisted: $(du -b /tmp/scratch/checkpoint-alt.pt | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - checkpoint-alt.pt
  hyperion-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Read staged data
          command: |
            test -s /tmp/scratch/checkpoint-alt.pt && echo nonempty || echo empty
      - run:
          name: Get fresh code
          command: git clone --depth 1 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: unxz -c collection.tar.xz | tar xf -
      - run:
          no_output_timeout: 70m
          command: sh -c "./job"
